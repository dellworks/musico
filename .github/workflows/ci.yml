name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check app tests
          mypy app
          pytest
      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Image
        run: docker build -t musico:ci .
